name: validate

# Stride is private, so `stride theme validate` cannot run here. This checks
# what can be checked without it: JSON syntax, the theme.json contract, file
# types and sizes, PNG dimensions, and that every published zip, icon and
# screenshot matches index.json and the theme sources byte for byte.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/check.py
      - name: The gallery is up to date
        run: |
          python3 tools/gallery.py
          git diff --exit-code site/index.html
