name: validate

# tools/check.py needs no Stride. It checks JSON syntax, the theme.json
# contract, file types and sizes, PNG dimensions, and that every published
# zip, icon and screenshot matches index.json and the theme sources byte for
# byte. A theme not in index.json yet is a submission and passes.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/check.py
      # The same validation Stride runs when a theme is installed, from the
      # published CLI: tokens, components and templates against Stride's own
      # types, which the file checks above cannot do.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: stride theme validate
        run: |
          for dir in themes/*/; do
            echo "::group::${dir}"
            npx -y @guuslab/stride@latest theme validate "$dir"
            echo "::endgroup::"
          done
      - name: The gallery is up to date
        run: |
          python3 tools/gallery.py
          git diff --exit-code site/index.html
